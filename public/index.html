<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Agents — Tu equipo especializado de IA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="site">
        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-inner">
                <div class="logo">Agency</div>
                <div class="nav-stats">
                    <span class="stat-badge"><span id="totalAgents">—</span> agentes</span>
                    <span class="stat-badge"><span id="totalDivisions">—</span> divisiones</span>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-inner">
                <h1>Tu equipo especializado de IA</h1>
                <p class="hero-subtitle">Agentes profesionales por especialidad, con una sola interfaz para buscarlos, revisarlos y copiarlos</p>

                <div class="search-hero">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Busca por nombre, especialidad... (atajo: /)"
                        class="search-input-hero"
                        aria-label="Buscar agentes"
                    >
                    <button class="search-btn" aria-label="Enfocar búsqueda">
                        <span>→</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="section-inner">
                <div class="stats-grid" id="statsContainer"></div>
            </div>
        </section>

        <!-- Controls Section -->
        <section class="filter-section">
            <div class="section-inner">
                <div class="filter-bar">
                    <label for="divisionFilter" class="filter-label">División:</label>
                    <select id="divisionFilter" class="division-select">
                        <option value="">Todas las divisiones</option>
                    </select>

                    <label for="sortSelect" class="filter-label">Ordenar:</label>
                    <select id="sortSelect" class="division-select">
                        <option value="title">Nombre</option>
                        <option value="division">División</option>
                    </select>

                    <span id="resultCount" class="result-count" aria-live="polite"></span>
                </div>
            </div>
        </section>

        <!-- Agents Section -->
        <section class="agents-section">
            <div class="section-inner">
                <div class="agents-grid" id="agentsGrid">
                    <div class="loading">Cargando agentes...</div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="section-inner">
                <p>Agency Agents Dashboard — Una forma más inteligente de gestionar tus agentes de IA</p>
            </div>
        </footer>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" aria-label="Cerrar">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Feedback -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
